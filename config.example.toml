# MediaSrv configuration
#
# Copy this file to config.toml next to the code, or to
# ~/.config/MediaSrv/config.toml, and edit as needed.
# Environment variables (MEDIASRV_*) override anything set here.

[server]
host = "0.0.0.0"     # 0.0.0.0 = reachable from your iPad on the LAN
port = 9000
# data_dir = "~/.cache/MediaSrv/data"   # library cache / covers / favorites / transcoded

[media]
# Folder roots to scan. "audio" and "video" are combined for scanning; the
# split is just a convenient way to describe your library. "paths" holds extra
# mixed folders. Relative paths are resolved against this config file.
audio = ["~/Music"]
video = ["~/Movies"]
paths = []

# Also descend into symbolic-linked folders.
follow_symlinks = false

# Skip dotfiles and dot-directories.
ignore_hidden = true

# Skip these paths. Each entry is matched as a glob against the full path and
# the folder/file name. Useful for a stalled network/external volume.
# exclude = ["/Volumes/olddrive", "*TV Library*"]
exclude = []

# If a directory does not respond within this many seconds, skip it instead of
# hanging (frozen mounts / TCC-protected app libraries). 0 disables the guard.
directory_timeout = 10

# Which file extensions count as playable.
audio_extensions = [".mp3"]
video_extensions = [".mp4", ".m4v", ".mov", ".mkv", ".webm"]
# Want more? e.g. audio_extensions = [".mp3", ".m4a", ".flac", ".aac"]

[player]
# Starting values for the web player (your in-browser changes are remembered
# locally and take precedence).
volume = 0.8          # 0.0 - 1.0
shuffle = false
repeat = "off"        # off | all | one
skip_seconds = 10     # rewind / forward jump size
theme = "dark"        # dark | light

[transcode]
# iPadOS Safari cannot play VP9/AV1 inside MP4. Videos whose codec is not
# web-safe are transcoded on demand to H.264 + AAC (kept in data/transcoded/).
# Requires ffmpeg/ffprobe on PATH.
enabled = true
encoder = "auto"        # auto | videotoolbox | libx264
video_bitrate = "5M"    # used by the hardware (videotoolbox) encoder
crf = 23                # used by libx264
preset = "veryfast"     # used by libx264
audio_bitrate = "160k"
# Transcoding is resumable: the source is cut into segments of this many
# seconds. Finished segments are kept if the server stops, so a restart only
# re-encodes what's left. Smaller = finer resume, more files.
segment_seconds = 30

[service]
# Used by deploy/install-launchd.sh to render the launchd plist. Nothing here
# is hard-coded into the plist; change these and re-run the installer.
label = "com.mediasrv"        # launchd job label
user = ""                     # user to run as; empty = current user
log_file = ""                 # empty = ~/Library/Logs/MediaSrv.log
path = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
