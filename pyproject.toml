[project]
name = "mediasrv"
version = "0.1.0"
description = "A tiny home media player server for playing local MP3/MP4 in the browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mutagen>=1.47",
]

[project.scripts]
mediasrv = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
